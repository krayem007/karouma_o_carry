<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>
    <link rel="stylesheet" href="/src/css/style.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
</head>
<body>
    <header>
        <a href="/src/html/index.html"><h2 id="home">Déclaration Facile</h2></a>
        <nav>
            <a href="/src/html/register.html">Créer un compte</a>
            <a href="/src/html/login.html">Connexion</a>
        </nav>
    </header>
    <section class="login-page">
        <ul class="breadcrumb">
            <li class="hover"><a href="/src/html/index.html">Accueil > </a></li>
            <li><a>Connexion</a></li>
        </ul>
        <div class="title-form">
            <h1 class="form-title">Connexion</h1>
        </div>
            <form action="#" class="login">
                <div class="section_title">Connectez-vous</div>
                <div class="main-user-info">
                    <label for="email" class="mail">E-mail :</label>
                    <input type="email" name="email" class="mail_input" required />
                </div>
                <div class="main-user-info">
                    <label for="password" class="mail">Mot de passe :</label>
                    <input type="password" name="password" class="mail_input" required/>
                </div>
                <div class="boutons">
                    <button class="button" type="submit">Se connecter</button>
                </div>
                <a href="#" class="password-forgot">Mot de passe oublié ?</a>
            </form>
     
    </section>

    <footer>
        <ul class="footer-icons">
            <li><a href="#"><ion-icon name="logo-facebook"></ion-icon></a></li>
            <li><a href="#"><ion-icon name="logo-twitter"></ion-icon></a></li>
            <li><a href="#"><ion-icon name="logo-instagram"></ion-icon></a></li>
            <li><a href="#"><ion-icon name="logo-linkedin"></ion-icon></a></li>
        </ul>
        <ul class="footer-menu">
            <li><a href="/src/html/index.html">Accueil</a></li>
            <li><a href="#">Conditions générales</a></li>
            <li><a href="#">FAQ</a></li>
            <li><a href="#">A propos</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
        <div class="footer-copyright">
            <p>Déclaration Facile © Copyright 2024. Tous droits réservés.</p>
        </div>
    </footer>

    <a href="#">
        <div class="up">
            <i class="fa fa-angle-up" aria-hidden="true"></i>
        </div>
    </a>
</body>
</html>
